<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劈开TXT</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f1efe8;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --accent: #534ab7;
    --accent-bg: #eeedfe;
    --accent-text: #3c3489;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #252523;
      --surface2: #2c2c2a;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --text: #f0ede8;
      --text2: #b4b2a9;
      --text3: #888780;
      --accent: #afa9ec;
      --accent-bg: #26215c;
      --accent-text: #cecbf6;
      --success-bg: #173404;
      --success-text: #c0dd97;
      --danger-bg: #501313;
      --danger-text: #f7c1c1;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
  }

  h1 {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 2rem;
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }

  .section-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }

  /* Drop zone */
  .drop-zone {
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: var(--surface2);
    position: relative;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon {
    width: 40px; height: 40px;
    margin: 0 auto 10px;
    background: var(--surface);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 0.5px solid var(--border2);
  }
  .drop-icon svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
  .drop-text { font-size: 14px; color: var(--text2); }
  .drop-hint { font-size: 12px; color: var(--text3); margin-top: 4px; }

  /* File info */
  .file-info {
    display: flex; align-items: center; gap: 12px;
    background: var(--accent-bg);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-top: 12px;
  }
  .file-info svg { width: 18px; height: 18px; stroke: var(--accent-text); fill: none; stroke-width: 1.8; flex-shrink: 0; }
  .file-name { font-size: 14px; font-weight: 500; color: var(--accent-text); word-break: break-all; }
  .file-meta { font-size: 12px; color: var(--text3); margin-top: 1px; }

  /* Parts selector */
  .parts-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .parts-label { font-size: 14px; color: var(--text2); }
  .parts-btns {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .part-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    display: flex; align-items: center; justify-content: center;
  }
  .part-btn:hover { background: var(--surface2); }
  .part-btn.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .custom-input {
    width: 64px; height: 36px;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    text-align: center;
    padding: 0 6px;
    outline: none;
  }
  .custom-input:focus { border-color: var(--accent); }

  /* Split button */
  .split-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .split-btn:hover { opacity: 0.9; }
  .split-btn:active { transform: scale(0.99); }
  .split-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .split-btn svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; }

  /* Progress */
  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
    margin: 12px 0 6px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.1s linear;
    width: 0%;
  }
  .progress-text { font-size: 12px; color: var(--text3); }

  /* Results */
  .result-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .result-item:last-child { border-bottom: none; }
  .result-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface2);
    color: var(--text2);
    font-size: 12px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .result-info { flex: 1; min-width: 0; }
  .result-fname { font-size: 13px; font-weight: 500; color: var(--text); word-break: break-all; }
  .result-chars { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .dl-btn {
    padding: 6px 14px;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    text-decoration: none;
    flex-shrink: 0;
    transition: background 0.1s;
  }
  .dl-btn:hover { background: var(--surface2); }
  .dl-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* Verify badge */
  .verify-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    margin-top: 14px;
  }
  .verify-badge.ok { background: var(--success-bg); color: var(--success-text); }
  .verify-badge.fail { background: var(--danger-bg); color: var(--danger-text); }
  .verify-badge svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }

  .dl-all-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--surface2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .dl-all-btn:hover { background: var(--border); }
  .dl-all-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .hidden { display: none !important; }

  @media (max-width: 500px) {
    body { padding: 1.2rem 0.75rem 3rem; }
    .card { padding: 1rem 1rem; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>劈开TXT</h1>
  <p class="subtitle">支持千万字长文本 · 按字符数均分 · 校验总字数</p>

  <div class="card">
    <div class="section-label">选择文件</div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".txt">
      <div class="drop-icon">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <div class="drop-text">点击或拖拽 TXT 文件到此处</div>
      <div class="drop-hint">支持 UTF-8 / GBK 编码</div>
    </div>
    <div class="file-info hidden" id="fileInfo">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <div>
        <div class="file-name" id="fileName"></div>
        <div class="file-meta" id="fileMeta"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">分割份数</div>
    <div class="parts-row">
      <span class="parts-label">劈成</span>
      <div class="parts-btns" id="partsBtns">
        <button class="part-btn" data-n="2">2</button>
        <button class="part-btn" data-n="3">3</button>
        <button class="part-btn" data-n="4">4</button>
        <button class="part-btn" data-n="5">5</button>
        <button class="part-btn" data-n="10">10</button>
      </div>
      <input type="number" class="custom-input" id="customParts" min="2" max="999" placeholder="自定" title="自定份数">
      <span class="parts-label">份</span>
    </div>
  </div>

  <div class="card">
    <button class="split-btn" id="splitBtn" disabled>
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      开始劈开
    </button>
    <div id="progressWrap" class="hidden" style="margin-top:12px">
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-text" id="progressText">准备中…</div>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="section-label">分割结果</div>
    <div id="resultList"></div>
    <div id="verifyBadge"></div>
    <button class="dl-all-btn hidden" id="dlAllBtn">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      全部下载
    </button>
  </div>
</div>

<script>
(function() {
  let fileContent = null;
  let fileName = '';
  let parts = 2;
  let chunks = [];

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileInfoEl = document.getElementById('fileInfo');
  const fileNameEl = document.getElementById('fileName');
  const fileMetaEl = document.getElementById('fileMeta');
  const splitBtn = document.getElementById('splitBtn');
  const resultCard = document.getElementById('resultCard');
  const resultList = document.getElementById('resultList');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const verifyBadge = document.getElementById('verifyBadge');
  const dlAllBtn = document.getElementById('dlAllBtn');
  const customParts = document.getElementById('customParts');

  // Default selected
  selectParts(2);

  document.getElementById('partsBtns').addEventListener('click', e => {
    const btn = e.target.closest('.part-btn');
    if (!btn) return;
    customParts.value = '';
    selectParts(parseInt(btn.dataset.n));
  });

  customParts.addEventListener('input', () => {
    const v = parseInt(customParts.value);
    document.querySelectorAll('.part-btn').forEach(b => b.classList.remove('active'));
    if (v >= 2) selectParts(v, true);
  });

  function selectParts(n, fromCustom) {
    parts = n;
    if (!fromCustom) {
      document.querySelectorAll('.part-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.n) === n);
      });
    }
  }

  // Drag & drop
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    if (!file.name.toLowerCase().endsWith('.txt')) {
      alert('请选择 .txt 文件');
      return;
    }
    fileName = file.name.replace(/\.txt$/i, '');

    // Read with FileReader — handles large files, tries UTF-8 then GBK
    const reader = new FileReader();
    reader.onload = e => {
      let text = e.target.result;
      // If garbled (lots of replacement chars), try GBK
      if ((text.match(/\uFFFD/g) || []).length > text.length * 0.02) {
        const reader2 = new FileReader();
        reader2.onload = e2 => {
          fileContent = e2.target.result;
          showFileInfo(file, fileContent.length);
        };
        reader2.readAsText(file, 'GBK');
      } else {
        fileContent = text;
        showFileInfo(file, fileContent.length);
      }
    };
    reader.readAsText(file, 'UTF-8');
  }

  function showFileInfo(file, charCount) {
    fileNameEl.textContent = file.name;
    fileMetaEl.textContent = `${fmtNum(charCount)} 字 · ${fmtSize(file.size)}`;
    fileInfoEl.classList.remove('hidden');
    splitBtn.disabled = false;
    resultCard.classList.add('hidden');
    resultList.innerHTML = '';
    verifyBadge.innerHTML = '';
    dlAllBtn.classList.add('hidden');
    chunks = [];
  }

  function fmtNum(n) {
    return n.toLocaleString('zh-CN');
  }
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1048576).toFixed(1) + ' MB';
  }

  splitBtn.addEventListener('click', () => {
    if (!fileContent) return;
    const n = parts;
    if (n < 2 || n > 999) { alert('份数请在 2~999 之间'); return; }
    doSplit(n);
  });

  function doSplit(n) {
    splitBtn.disabled = true;
    progressWrap.classList.remove('hidden');
    progressBar.style.width = '0%';
    progressText.textContent = '正在分割…';
    resultCard.classList.add('hidden');
    chunks = [];

    // Use setTimeout to let UI update before heavy work
    setTimeout(() => {
      const total = fileContent.length;
      const baseSize = Math.floor(total / n);
      const remainder = total % n;

      // Split positions: first `remainder` chunks get baseSize+1
      let pos = 0;
      const positions = [];
      for (let i = 0; i < n; i++) {
        const size = baseSize + (i < remainder ? 1 : 0);
        positions.push({ start: pos, end: pos + size });
        pos += size;
      }

      // Process in async batches to keep UI alive
      let i = 0;
      function processChunk() {
        const BATCH = 5;
        const end = Math.min(i + BATCH, n);
        for (; i < end; i++) {
          const { start, end: e } = positions[i];
          chunks.push(fileContent.slice(start, e));
        }
        const pct = Math.round((i / n) * 100);
        progressBar.style.width = pct + '%';
        progressText.textContent = `已处理 ${i} / ${n} 份… ${pct}%`;

        if (i < n) {
          setTimeout(processChunk, 0);
        } else {
          showResults(n);
        }
      }
      processChunk();
    }, 30);
  }

  function showResults(n) {
    progressBar.style.width = '100%';
    progressText.textContent = '完成！';
    setTimeout(() => progressWrap.classList.add('hidden'), 800);

    const totalOrig = fileContent.length;
    let totalChunks = 0;
    resultList.innerHTML = '';

    chunks.forEach((chunk, idx) => {
      totalChunks += chunk.length;
      const partName = `${fileName}-${idx + 1}.txt`;
      const div = document.createElement('div');
      div.className = 'result-item';
      div.innerHTML = `
        <div class="result-num">${idx + 1}</div>
        <div class="result-info">
          <div class="result-fname">${partName}</div>
          <div class="result-chars">${fmtNum(chunk.length)} 字</div>
        </div>
        <a class="dl-btn" href="#" data-idx="${idx}" data-name="${partName}">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          保存
        </a>
      `;
      resultList.appendChild(div);
    });

    // Bind download
    resultList.querySelectorAll('.dl-btn').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const idx = parseInt(a.dataset.idx);
        downloadChunk(idx, a.dataset.name);
      });
    });

    // Verify
    verifyBadge.innerHTML = '';
    const ok = totalChunks === totalOrig;
    const badge = document.createElement('div');
    badge.className = 'verify-badge ' + (ok ? 'ok' : 'fail');
    if (ok) {
      badge.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> 总字数校验通过：${fmtNum(totalOrig)} 字 = ${n} 份合计 ${fmtNum(totalChunks)} 字`;
    } else {
      badge.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> 校验失败：原文 ${fmtNum(totalOrig)} 字，合计 ${fmtNum(totalChunks)} 字`;
    }
    verifyBadge.appendChild(badge);

    dlAllBtn.classList.remove('hidden');
    resultCard.classList.remove('hidden');
    splitBtn.disabled = false;
  }

  function downloadChunk(idx, name) {
    const blob = new Blob([chunks[idx]], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  dlAllBtn.addEventListener('click', () => {
    chunks.forEach((_, idx) => {
      const name = `${fileName}-${idx + 1}.txt`;
      setTimeout(() => downloadChunk(idx, name), idx * 150);
    });
  });
})();
</script>
</body>
</html>
