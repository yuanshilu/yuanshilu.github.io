<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打印歌</title>
<style>
  body { margin: 0; background: #e8e0d0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 2rem; box-sizing: border-box; }
  svg  { max-width: 680px; width: 100%; display: block; }
</style>
</head>
<body>
<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg">
  <title>打印歌——A4/A5/A6尺寸记忆口诀</title>
  <desc>宣纸印章风格的打印纸尺寸记忆口诀海报，配色取自国色中国传统色谱</desc>

  <style>
    .poem-bg   { fill: #f5f0e8; }
    .b-out     { fill: none; stroke: #8b6f47; stroke-width: 2.5; }
    .b-in      { fill: none; stroke: #8b6f47; stroke-width: 0.8; }
    .title-txt { font-family: serif; font-size: 28px; font-weight: 500; fill: #2c1a0e; text-anchor: middle; }
    .poem-line { font-family: serif; font-size: 26px; font-weight: 400; fill: #2c1a0e; text-anchor: middle; letter-spacing: 3px; }
    .sub-txt   { font-family: serif; font-size: 14px; fill: #7a5c3a; text-anchor: middle; }
    .note-txt  { font-family: serif; font-size: 11px; fill: #5a4535; }
    .divider   { stroke: #8b6f47; stroke-width: 0.8; }
    .dot-bg    { fill: #c8a97a; opacity: 0.18; }

    /* 尺寸标注同步 */
    .col-a5r   { fill: #4d8c57; }   /* 竹青 → 爱你了 / 21.0 */
    .col-a5g   { fill: #c03c30; }   /* 胭脂 → 你是花 / 14.8 */
    .col-a4    { fill: #1a5276; }   /* 靛青 → 爱酒恰 / 29.7 */
    .col-a6    { fill: #6a4c93; }   /* 紫苑 → 矮     / 10.5 */

    .box-a5    { fill: #eaf5ec; stroke: #4d8c57; stroke-width: 1.2; }
    .box-a4    { fill: #e8f0f7; stroke: #1a5276; stroke-width: 1.2; }
    .box-a6    { fill: #f0ecf7; stroke: #6a4c93; stroke-width: 1.2; }
    .box-ghost { fill: none; stroke: #6a4c93; stroke-width: 1; stroke-dasharray: 4,3; }
    .lbl-a5    { font-family: serif; font-size: 13px; fill: #4d8c57; text-anchor: middle; }
    .lbl-a4    { font-family: serif; font-size: 13px; fill: #1a5276; text-anchor: middle; }
    .lbl-a6    { font-family: serif; font-size: 13px; fill: #6a4c93; text-anchor: middle; }
    .dim-txt   { font-family: serif; font-size: 11px; fill: #5a4535; text-anchor: start; }

    .seal-b    { fill: none; stroke: #c03c30; stroke-width: 1.5; }
    .seal-txt  { font-family: serif; font-size: 11px; fill: #c03c30; text-anchor: middle; }
    .seal-link { cursor: pointer; }

    .credit-txt { font-family: serif; font-size: 10px; fill: #8b6f47; }
    .credit-lnk { font-family: serif; font-size: 10px; fill: #1a5276; text-decoration: underline; }
  </style>

  <rect width="680" height="760" class="poem-bg"/>
  <circle cx="60"  cy="60"  r="32" class="dot-bg"/>
  <circle cx="620" cy="60"  r="32" class="dot-bg"/>
  <circle cx="60"  cy="700" r="32" class="dot-bg"/>
  <circle cx="620" cy="700" r="32" class="dot-bg"/>
  <rect x="28" y="28" width="624" height="704" rx="2" class="b-out"/>
  <rect x="38" y="38" width="604" height="684" rx="1" class="b-in"/>

  <!-- 标题 -->
  <text x="340" y="90" class="title-txt">《 打 印 歌 》</text>
  <line x1="100" y1="106" x2="580" y2="106" class="divider"/>
  <line x1="110" y1="112" x2="570" y2="112" class="divider" stroke-dasharray="3,4"/>

  <!-- A5 句：5普通色，爱你了→竹青，你是花→胭脂 -->
  <text y="160" class="poem-line">
    <tspan x="340" text-anchor="middle">
      <tspan fill="#2c1a0e">5</tspan><tspan class="col-a5r">爱你了</tspan><tspan class="col-a5g">你是花</tspan>
    </tspan>
  </text>
  <text x="340" y="184" class="sub-txt">
    <tspan fill="#7a5c3a">高 </tspan><tspan class="col-a5r">21.0</tspan><tspan fill="#7a5c3a"> cm · 宽 </tspan><tspan class="col-a5g">14.8</tspan><tspan fill="#7a5c3a"> cm</tspan>
  </text>

  <!-- A4 句 -->
  <text y="234" class="poem-line">
    <tspan x="340" text-anchor="middle">
      <tspan fill="#2c1a0e">A4肚肚</tspan><tspan class="col-a4">爱酒恰</tspan>
    </tspan>
  </text>
  <text x="340" y="258" class="sub-txt">
    <tspan fill="#7a5c3a">高 21.0 cm · 宽 </tspan><tspan class="col-a4">29.7</tspan><tspan fill="#7a5c3a"> cm</tspan>
  </text>

  <!-- A6 句 -->
  <text y="310" class="poem-line">
    <tspan x="340" text-anchor="middle">
      <tspan fill="#2c1a0e">A6挂个</tspan><tspan class="col-a6">矮</tspan><tspan fill="#2c1a0e">冬瓜</tspan>
    </tspan>
  </text>
  <text x="340" y="334" class="sub-txt">
    <tspan fill="#7a5c3a">高 </tspan><tspan class="col-a6">10.5</tspan><tspan fill="#7a5c3a"> cm · 宽 14.8 cm</tspan>
  </text>

  <!-- 分割线 -->
  <line x1="110" y1="358" x2="570" y2="358" class="divider" stroke-dasharray="3,4"/>
  <line x1="100" y1="364" x2="580" y2="364" class="divider"/>

  <!-- ══════════════════════════════════════════
       比例示意图

       底边 y=542
       A4: x=144 y=418 w=176 h=124   右边 x=320
       A5: x=340 y=418 w=88  h=124   右边 x=428
       A6 ghost: x=448 y=418 w=88 h=62
       A6 实线:  x=448 y=480 w=88 h=62  底边 y=542  右边 x=536

       A4注释：左对齐 x=144，不超 x=320，底边下 y≈556
       A6注释：右对齐 x=536，不超左 x=448，底边下 y≈556
       148递增：A5底边下，居中 x=384，y≈556
       210递减：A5右边外侧正向，x=432，y约中部
  ══════════════════════════════════════════ -->

  <!-- A4 框 -->
  <rect x="144" y="418" width="176" height="124" class="box-a4"/>
  <line x1="232" y1="418" x2="232" y2="542" stroke="#1a5276" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="232" y="487" class="lbl-a4">A4</text>
  <!-- A4 底边下注释：左对齐，宽不超出A4右边x=320 -->
  <text x="174" y="556" class="note-txt">4像一个啤酒肚，胖胖的。</text>

  <!-- A5 框 -->
  <rect x="340" y="418" width="88" height="124" class="box-a5"/>
  <text x="384" y="487" class="lbl-a5">A5</text>
  <!-- 148递增：A5底边正下方居中 -->
  <text x="384" y="556" font-family="serif" font-size="11" fill="#5a4535" text-anchor="middle">148 递增</text>
  <!-- 210递减：A5右边外侧，正向两行，紧贴右边 x=432 -->
  <text x="330" y="448" class="dim-txt">2</text>
  <text x="330" y="461" class="dim-txt">1</text>
  <text x="330" y="474" class="dim-txt">0</text>
  <text x="328" y="487" class="dim-txt">递</text>
  <text x="328" y="500" class="dim-txt">减</text>

  <!-- A6 ghost -->
  <rect x="448" y="418" width="88" height="62" class="box-ghost"/>
  <!-- A6 实线 -->
  <rect x="448" y="480" width="88" height="62" class="box-a6"/>
  <text x="492" y="518" class="lbl-a6">A6</text>
  <!-- A6 底边下注释：右对齐 x=536，不超左边 x=448 -->
  <text x="586" y="556" class="note-txt" text-anchor="end">6像挂着的小冬瓜，矮矮的。</text>

  <!-- ══════════════════════════════════════════
       右下角（全部右对齐 x=628）：
         印章（可点击链接）  y≈620~656
         间隔 8px
         日期               y≈672
         间隔 8px
         配色参考行          y≈688
  ══════════════════════════════════════════ -->

  <!-- 印章作为链接 -->
  <a href="https://yuanshilu.top" target="_blank" class="seal-link">
    <rect x="562" y="608" width="72" height="36" rx="2" class="seal-b"/>
    <rect x="565" y="611" width="66" height="30" rx="1" class="seal-b" stroke-dasharray="2,2"/>
    <text x="598" y="631" class="seal-txt">远视鹿</text>
  </a>

  <!-- 日期（印章底边644 + 间隔16 = 660） -->
  <text x="628" y="660" font-family="serif" font-size="12" fill="#a08060" text-anchor="end">2026.04.19</text>

  <!-- 配色参考（日期660 + 间隔16 = 676） -->
  <text x="628" y="676" text-anchor="end">
    <tspan class="credit-txt">配色参考 </tspan><a href="https://yuanshilu.top/gsxg/index.html" target="_blank"><tspan class="credit-lnk">国色滴管</tspan></a>
  </text>

</svg>
</body>
</html>
