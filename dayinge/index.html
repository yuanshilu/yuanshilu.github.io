<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打印歌</title>
<style>
  body { margin: 0; background: #e8e0d0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 2rem; box-sizing: border-box; }
  svg  { max-width: 680px; width: 100%; display: block; }
</style>
</head>
<body>
<!--
  打印歌 SVG 海报
  viewBox: 680 × 962  （竖向 A4 比例，210:297）
  配色取自国色 https://yuanshilu.top/gsxg/index.html
    竹青 #4d8c57  → 爱你了 / 21.0
    胭脂 #c03c30  → 你是花 / 14.8
    靛青 #1a5276  → 爱酒恰 / 29.7
    紫苑 #6a4c93  → 矮     / 10.5
-->
<svg id="main-svg" width="680" height="962" viewBox="0 0 680 962" xmlns="http://www.w3.org/2000/svg">
  <title>打印歌——A4/A5/A6尺寸记忆口诀</title>
  <desc>宣纸印章风格的打印纸尺寸记忆口诀海报，配色取自国色中国传统色谱</desc>

  <style>
    .poem-bg   { fill: #f5f0e8; }
    .b-out     { fill: none; stroke: #8b6f47; stroke-width: 2.5; }
    .b-in      { fill: none; stroke: #8b6f47; stroke-width: 0.8; }
    .title-txt { font-family: serif; font-size: 28px; font-weight: 500; fill: #2c1a0e; text-anchor: middle; }
    .poem-line { font-family: serif; font-size: 26px; font-weight: 400; fill: #2c1a0e; text-anchor: middle; letter-spacing: 3px; }
    .sub-txt   { font-family: serif; font-size: 14px; fill: #7a5c3a; text-anchor: middle; }
    .note-txt  { font-family: serif; font-size: 11px; fill: #5a4535; }
    .divider   { stroke: #8b6f47; stroke-width: 0.8; }
    .dot-bg    { fill: #c8a97a; opacity: 0.18; }

    .col-a5r   { fill: #4d8c57; }
    .col-a5g   { fill: #c03c30; }
    .col-a4    { fill: #1a5276; }
    .col-a6    { fill: #6a4c93; }

    .box-a5    { fill: #eaf5ec; stroke: #4d8c57; stroke-width: 1.2; }
    .box-a4    { fill: #e8f0f7; stroke: #1a5276; stroke-width: 1.2; }
    .box-a6    { fill: #f0ecf7; stroke: #6a4c93; stroke-width: 1.2; }
    .box-ghost { fill: none; stroke: #6a4c93; stroke-width: 1; stroke-dasharray: 4,3; }
    .lbl-a5    { font-family: serif; font-size: 13px; fill: #4d8c57; text-anchor: middle; }
    .lbl-a4    { font-family: serif; font-size: 13px; fill: #1a5276; text-anchor: middle; }
    .lbl-a6    { font-family: serif; font-size: 13px; fill: #6a4c93; text-anchor: middle; }
    .dim-txt   { font-family: serif; font-size: 11px; fill: #5a4535; text-anchor: start; }

    .seal-b    { fill: none; stroke: #c03c30; stroke-width: 1.5; }
    .seal-txt  { font-family: serif; font-size: 11px; fill: #c03c30; text-anchor: middle; }
    .seal-save-b   { fill: none; stroke: #1a5276; stroke-width: 1.5; }
    .seal-save-txt { font-family: serif; font-size: 11px; fill: #1a5276; text-anchor: middle; }

    .credit-txt { font-family: serif; font-size: 10px; fill: #8b6f47; }
    .credit-lnk { font-family: serif; font-size: 10px; fill: #1a5276; text-decoration: underline; cursor: pointer; }
  </style>

  <!-- 背景 & 边框 -->
  <rect width="680" height="962" class="poem-bg"/>
  <circle cx="60"  cy="76"  r="32" class="dot-bg"/>
  <circle cx="620" cy="76"  r="32" class="dot-bg"/>
  <circle cx="60"  cy="886" r="32" class="dot-bg"/>
  <circle cx="620" cy="886" r="32" class="dot-bg"/>
  <rect x="28" y="35" width="624" height="892" rx="2" class="b-out"/>
  <rect x="38" y="48" width="604" height="866" rx="1" class="b-in"/>

  <!-- 标题 -->
  <text x="340" y="114" class="title-txt">《 打 印 歌 》</text>
  <line x1="100" y1="134" x2="580" y2="134" class="divider"/>
  <line x1="110" y1="142" x2="570" y2="142" class="divider" stroke-dasharray="3,4"/>

  <!-- A5 句 -->
  <text y="202" class="poem-line">
    <tspan x="340" text-anchor="middle">
      <tspan fill="#2c1a0e">5</tspan><tspan class="col-a5r">爱你了</tspan><tspan class="col-a5g">你是花</tspan>
    </tspan>
  </text>
  <text x="340" y="233" class="sub-txt">
    <tspan fill="#7a5c3a">高 </tspan><tspan class="col-a5r">21.0</tspan><tspan fill="#7a5c3a"> cm · 宽 </tspan><tspan class="col-a5g">14.8</tspan><tspan fill="#7a5c3a"> cm</tspan>
  </text>

  <!-- A4 句 -->
  <text y="296" class="poem-line">
    <tspan x="340" text-anchor="middle">
      <tspan fill="#2c1a0e">A4肚肚</tspan><tspan class="col-a4">爱酒恰</tspan>
    </tspan>
  </text>
  <text x="340" y="326" class="sub-txt">
    <tspan fill="#7a5c3a">高 21.0 cm · 宽 </tspan><tspan class="col-a4">29.7</tspan><tspan fill="#7a5c3a"> cm</tspan>
  </text>

  <!-- A6 句 -->
  <text y="392" class="poem-line">
    <tspan x="340" text-anchor="middle">
      <tspan fill="#2c1a0e">A6挂个</tspan><tspan class="col-a6">矮</tspan><tspan fill="#2c1a0e">冬瓜</tspan>
    </tspan>
  </text>
  <text x="340" y="423" class="sub-txt">
    <tspan fill="#7a5c3a">高 </tspan><tspan class="col-a6">10.5</tspan><tspan fill="#7a5c3a"> cm · 宽 14.8 cm</tspan>
  </text>

  <!-- 分割线 -->
  <line x1="110" y1="453" x2="570" y2="453" class="divider" stroke-dasharray="3,4"/>
  <line x1="100" y1="461" x2="580" y2="461" class="divider"/>

  <!-- A4 框 -->
  <rect x="144" y="529" width="176" height="157" class="box-a4"/>
  <line x1="232" y1="529" x2="232" y2="686" stroke="#1a5276" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="232" y="617" class="lbl-a4">A4</text>
  <text x="182" y="704" class="note-txt">4像一个啤酒肚，胖胖的。</text>

  <!-- A5 框 -->
  <rect x="340" y="529" width="88" height="157" class="box-a5"/>
  <text x="384" y="617" class="lbl-a5">A5</text>
  <text x="384" y="704" font-family="serif" font-size="11" fill="#5a4535" text-anchor="middle">148 递增</text>
  <text x="328" y="574" class="dim-txt" text-anchor="end">2</text>
  <text x="328" y="587" class="dim-txt" text-anchor="end">1</text>
  <text x="328" y="600" class="dim-txt" text-anchor="end">0</text>
  <text x="326" y="615" class="dim-txt" text-anchor="end">递</text>
  <text x="326" y="628" class="dim-txt" text-anchor="end">减</text>

  <!-- A6 ghost：x=448 y=529 w=88 h=78 -->
  <rect x="448" y="529" width="88" height="78" class="box-ghost"/>
  <!-- A6 实线：x=448 y=607 w=88 h=79 底=686 -->
  <rect x="448" y="607" width="88" height="79" class="box-a6"/>
  <text x="492" y="652" class="lbl-a6">A6</text>
  <text x="586" y="704" class="note-txt" text-anchor="end">6像挂着的小冬瓜，矮矮的。</text>

  <!-- ══════════════════════════════════════════
       右下角（右对齐 x=628）：
         印章 远视鹿  top=769 h=36 底=805  → 链接 yuanshilu.top
         日期         y=835
         配色备注     y=855

       左下角：
         印章 留存备览  水平与远视鹿对齐 top=769 h=36
                       左边与A4框左边对齐 x=144
                       点击保存SVG为PNG
  ══════════════════════════════════════════ -->

  <!-- 远视鹿印章（右下） -->
  <a href="https://yuanshilu.top" target="_blank" style="cursor:pointer;">
    <rect x="556" y="769" width="72" height="36" rx="2" class="seal-b"/>
    <rect x="559" y="772" width="66" height="30" rx="1" class="seal-b" stroke-dasharray="2,2"/>
    <text x="592" y="792" class="seal-txt">远视鹿</text>
  </a>

  <!-- 日期 -->
  <text x="628" y="835" font-family="serif" font-size="12" fill="#a08060" text-anchor="end">2026.04.19</text>

  <!-- 配色备注 -->
  <text x="628" y="855" text-anchor="end">
    <tspan class="credit-txt">配色参考 </tspan><tspan class="credit-lnk" onclick="window.open('https://yuanshilu.top/gsxg/index.html','_blank')">国色滴管</tspan>
  </text>

  <!-- 留存备览印章（左下，与远视鹿水平对齐，左边 x=144） -->
  <g id="save-stamp" style="cursor:pointer;" onclick="saveSvgAsPng()">
    <rect x="144" y="769" width="72" height="36" rx="2" class="seal-save-b"/>
    <rect x="147" y="772" width="66" height="30" rx="1" class="seal-save-b" stroke-dasharray="2,2"/>
    <text x="180" y="792" class="seal-save-txt">留存备览</text>
  </g>

</svg>

<script>
function saveSvgAsPng() {
  const svg = document.getElementById('main-svg');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = function () {
    const scale = 2; // 2x 清晰度
    const canvas = document.createElement('canvas');
    canvas.width  = svg.width.baseVal.value * scale;
    canvas.height = svg.height.baseVal.value * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    canvas.toBlob(function (blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '打印歌.png';
      a.click();
    }, 'image/png');
  };
  img.src = url;
}
</script>
</body>
</html>
