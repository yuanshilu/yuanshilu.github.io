<script>
function saveSvgAsPng(id) {
  const svg = document.getElementById('main-svg'+id);
  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(svg);
  
  // 确保导出时包含字体信息
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const img = new Image();
  img.onload = function () {
    const scale = 3; // 提升到 3 倍清晰度，适合打印
    const canvas = document.createElement('canvas');
    canvas.width  = svg.getAttribute('width') * scale;
    canvas.height = svg.getAttribute('height') * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "#fcfaf2"; // 确保背景不透明
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    canvas.toBlob(function (blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "打印机之歌" + ((id==0)?"-问题":"-答案") + ".png";
      a.click();
    }, 'image/png');
  };
  img.src = url;
}

function saveSvgAsPng0() {
  saveSvgAsPng(0);
}

function saveSvgAsPng1() {
  saveSvgAsPng(1);
}

</script>
